  <!-- JavaScript 部分 -->
  <script>
    // 定义需要循环切换的背景图片数组
    const images = [
      './image/compass_background_remove.png',
      './image/compass_background1.png',
      // './image/compass_background2.png',
      // './image/compass_background3.png',
      './image/compass_background5.png',
      // './image/compass_background6.png',
      './image/compass_background7.png'
    ];

    let currentIndex = 0;
    const bgContainer = document.getElementById('bg-container');

    // 初始化时使用第一张图片
    let currentBgDiv = document.createElement('div');
    currentBgDiv.classList.add('bg-image');
    currentBgDiv.style.backgroundImage = `url(${images[currentIndex]})`;
    bgContainer.appendChild(currentBgDiv);

    // 更新索引为下一张图片
    currentIndex = (currentIndex + 1) % images.length;

    // 每隔5秒切换一次背景，采用从左到右渐进的过渡效果
    setInterval(() => {
      // 创建新的背景 div，初始位置设置在屏幕左侧（-100%）
      const nextBgDiv = document.createElement('div');
      nextBgDiv.classList.add('bg-image');
      nextBgDiv.style.backgroundImage = `url(${images[currentIndex]})`;
      nextBgDiv.style.transform = 'translateX(-100%)';
      bgContainer.appendChild(nextBgDiv);

      // 延时触发过渡（确保浏览器已应用初始状态）
      setTimeout(() => {
        // 新的背景滑入到正确位置
        nextBgDiv.style.transform = 'translateX(0)';
        // 当前背景同时向右滑出
        currentBgDiv.style.transform = 'translateX(100%)';
      }, 50);

      // 过渡结束后（1秒后）移除旧背景，更新当前背景引用
      setTimeout(() => {
        bgContainer.removeChild(currentBgDiv);
        currentBgDiv = nextBgDiv;
      }, 1050);

      // 更新索引
      currentIndex = (currentIndex + 1) % images.length;
    }, 10000);
  </script>
